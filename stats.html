</style></head><body><header><div class="head"><div class="brand"><img src="youth-logo.svg"><div><b>הפועל ״אבי״ חולון</b><div class="sub">משחק אימון מול בני הרצליה · 07.10.2026</div></div></div><div class="qpill" id="qpill">רבע 1</div></div><div class="score"><div><small>חולון</small> <strong id="ours">0</strong></div><b>:</b><div><small>הרצליה</small> <strong id="opp">0</strong><span class="oppBtns"><button onclick="addOpp(1)">+1</button><button onclick="addOpp(2)">+2</button><button onclick="addOpp(3)">+3</button><button onclick="addOpp(-1)">↶</button></span></div></div></header><main>

<script>

var A=[['m2','2 ✓','make'],['x2','2 ✗','miss'],['m3','3 ✓','make'],['x3','3 ✗','miss'],['m1','1 ✓','make'],['x1','1 ✗','miss'],['or','ריב׳ ה','other'],['dr','ריב׳ ג','other'],['a','אסיסט','other'],['s','חטיפה','other'],['to','איבוד','warn'],['pf','עבירה','warn'],['ora','ריב׳ יריב עליי','warn']];

function blank(){var o={};F.forEach(function(x){o[x]=0});return o}
function fresh(){var q={};for(var i=1;i<5;i++){q[i]={p:{},opp:0};P.forEach(function(x){q[i].p[x[0]]=blank()})}return{qtr:1,q:q,log:[]}}

function setQ(q){st.qtr=q;save();render();scrollTo(0,0)}
function addOpp(v){var q=st.qtr;if(v<0){if(st.q[q].opp>0){st.q[q].opp--;st.log.push({t:'o',q:q,v:-1})}}else{st.q[q].opp+=v;st.log.push({t:'o',q:q,v:v})}save();render()}
function undo(){var e=st.log.pop();if(!e){flash('אין פעולה לביטול');return}if(e.t=='p'){s(e.q,e.n)[e.f]=Math.max(0,s(e.q,e.n)[e.f]-1);flash('בוטל: '+playerName(e.n)+' · '+L[e.f])}else{if(e.v>0)st.q[e.q].opp=Math.max(0,st.q[e.q].opp-e.v);else st.q[e.q].opp++;flash('בוטל שינוי ניקוד יריבה')}save();render()}
function renderLast(){var e=st.log[st.log.length-1],el=document.getElementById('lastText');if(!e){el.textContent='מוכן להזנה מהירה';return}el.textContent=e.t=='p'?'אחרון: '+playerName(e.n)+' · '+L[e.f]:'אחרון: שינוי ניקוד הרצליה'}

function renderSum(){var T=[['q1','רבע 1'],['q2','רבע 2'],['half','מחצית'],['q3','רבע 3'],['q4','רבע 4'],['game','משחק']];document.getElementById('tabs').innerHTML=T.map(function(t){return '<button class="'+(range==t[0]?'on':'')+'" onclick="setR(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');var a=qs(range),t=team(a),title=range=='half'?'סיכום מחצית':range=='game'?'סיכום משחק':'סיכום רבע '+range.slice(1),half=range=='half'?'<div class="half"><b>תמונת מחצית</b><div>תוצאה '+our(a)+' : '+opp(a)+' · אסיסטים '+t.a+' · איבודים '+t.to+' · ORB יריבה '+t.ora+'</div></div>':'';var rows=P.map(function(p){var x=sum(a,p[0]);return '<tr><td>#'+p[0]+' '+p[1]+'</td><td>'+pts(x)+'</td><td>'+x.m2+'/'+(x.m2+x.x2)+'</td><td>'+pct(x.m2,x.x2)+'</td><td>'+x.m3+'/'+(x.m3+x.x3)+'</td><td>'+pct(x.m3,x.x3)+'</td><td>'+x.m1+'/'+(x.m1+x.x1)+'</td><td>'+pct(x.m1,x.x1)+'</td><td>'+reb(x)+'</td><td>'+x.a+'</td><td>'+x.s+'</td><td>'+x.to+'</td><td>'+x.pf+'</td><td>'+x.ora+'</td></tr>'}).join('');document.getElementById('summary').innerHTML=half+'<div class="card"><b>'+title+' · '+our(a)+' : '+opp(a)+'</b><div class="kpis" style="margin-top:9px"><div class="kpi"><b>'+pct(t.m2,t.x2)+'</b><span>2 נק׳</span></div><div class="kpi"><b>'+pct(t.m3,t.x3)+'</b><span>3 נק׳</span></div><div class="kpi"><b>'+pct(t.m1,t.x1)+'</b><span>עונשין</span></div><div class="kpi"><b>'+reb(t)+'</b><span>ריבאונדים</span></div><div class="kpi"><b>'+t.a+'</b><span>אסיסטים</span></div><div class="kpi"><b>'+t.to+'</b><span>איבודים</span></div><div class="kpi"><b>'+t.ora+'</b><span>ORB יריבה עלינו</span></div></div></div><div class="table"><table><thead><tr><th>שחקן</th><th>נק׳</th><th>2P</th><th>2P%</th><th>3P</th><th>3P%</th><th>FT</th><th>FT%</th><th>REB</th><th>AST</th><th>STL</th><th>TO</th><th>PF</th><th>ORB נגדו</th></tr></thead><tbody>'+rows+'<tr class="total"><td>קבוצה</td><td>'+pts(t)+'</td><td>'+t.m2+'/'+(t.m2+t.x2)+'</td><td>'+pct(t.m2,t.x2)+'</td><td>'+t.m3+'/'+(t.m3+t.x3)+'</td><td>'+pct(t.m3,t.x3)+'</td><td>'+t.m1+'
