<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#35185f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="אבי סטטיסטיקה"><title>סטטיסטיקה | הפועל אבי חולון</title><style>
:root{--p:#35185f;--p2:#623ba0;--y:#f2c433;--bg:#f7f3e9;--ink:#21172f;--mut:#746d80;--line:#e5ddec;--g:#127846;--r:#b73535}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:82px}button{font:inherit}header{position:sticky;top:0;z-index:10;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 13px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:42px;height:42px;background:#fff;border-radius:11px;padding:3px}.brand b{display:block}.sub{font-size:11px;opacity:.85;margin-top:2px}.qpill{background:#fff;color:var(--p);padding:8px 11px;border-radius:999px;font-weight:900}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px;background:#ffffff18;border:1px solid #ffffff2c;border-radius:15px;padding:9px;text-align:center}.score strong{font-size:27px;display:block}.oppBtns button{border:0;border-radius:8px;background:#ffffff20;color:#fff;padding:5px 7px;font-weight:900;margin:4px 2px 0}main{max-width:820px;margin:auto;padding:12px}.view{display:none}.view.on{display:block}.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.qs button,.tabs button{border:1px solid var(--line);background:#fff;color:var(--p);border-radius:12px;padding:10px 5px;font-weight:900}.qs button.on,.tabs button.on{background:var(--p);color:#fff}.roster{display:grid;gap:8px}.pl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px}.num{width:42px;height:42px;border-radius:13px;background:var(--p);color:var(--y);display:grid;place-items:center;font-weight:950}.name{font-weight:900}.mini{font-size:11px;color:var(--mut);margin-top:3px}.pts{font-size:21px;font-weight:950;color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{border:0;background:#eee7f4;color:var(--p);border-radius:10px;padding:9px 11px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.act{border:0;border-radius:13px;padding:13px 7px;font-weight:950}.ok{background:#e5f4ec;color:var(--g)}.bad{background:#fde9e9;color:var(--r)}.neu{background:#f0eaf6;color:var(--p)}.gold{background:#fff2a6;color:#5d4b00}.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0}.box{background:#f7f3fa;border-radius:11px;padding:7px;text-align:center}.box b{display:block;font-size:17px}.box span{font-size:9px;color:var(--mut)}.end{width:100%;border:0;background:var(--y);color:#352b00;border-radius:15px;padding:14px;font-size:16px;font-weight:950;margin-top:10px}.undo{width:100%;border:1px solid #edcccc;background:#fff;color:var(--r);border-radius:12px;padding:11px;font-weight:900;margin-top:9px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap;border-radius:999px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.kpi b{display:block;font-size:19px;color:var(--p)}.kpi span{font-size:9px;color:var(--mut)}.half{background:linear-gradient(135deg,#fff4a6,#ffe33d);border-radius:15px;padding:12px;margin-bottom:10px}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table table{border-collapse:collapse;width:100%;min-width:720px;font-size:11px}.table th,.table td{padding:8px 6px;text-align:center;border-bottom:1px solid #eee8f2}.table th{background:#f6f1f9;color:var(--p)}.table td:first-child{text-align:right;font-weight:900}.total td{background:#fff8cf;font-weight:950}nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:6px}nav button{border:0;background:transparent;color:var(--mut);border-radius:11px;padding:8px 3px;font-weight:900}nav button.on{background:#eee7f4;color:var(--p)}.modal{position:fixed;inset:0;background:#21152b99;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:17px 15px calc(18px + env(safe-area-inset-bottom))}.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheetBtns button{border:0;border-radius:13px;padding:12px;font-weight:950}.primary{background:var(--p);color:#fff}.secondary{background:#eee7f4;color:var(--p)}@media(min-width:700px){.roster{grid-template-columns:1fr 1fr}.actions{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(6,1fr)}}
</style></head><body><header><div class="head"><div class="brand"><img src="youth-logo.svg"><div><b>הפועל ״אבי״ חולון</b><div class="sub">משחק אימון מול בני הרצליה · 07.10.2026</div></div></div><div class="qpill" id="qpill">רבע 1</div></div><div class="score"><div><small>חולון</small><strong id="ours">0</strong></div><b>:</b><div><small>הרצליה</small><strong id="opp">0</strong><div class="oppBtns"><button onclick="addOpp(1)">+1</button><button onclick="addOpp(2)">+2</button><button onclick="addOpp(3)">+3</button><button onclick="addOpp(-1)">↶</button></div></div></div></header><main>
<section id="game" class="view on"><div class="qs" id="qs"></div><div id="pick"><div class="roster" id="roster"></div><button class="end" onclick="endQ()">סיום רבע והצגת סיכום</button></div><div id="entry" style="display:none"></div></section>
<section id="sum" class="view"><div class="tabs" id="tabs"></div><div id="summary"></div></section>
<section id="tools" class="view"><div class="card"><b>הנתונים נשמרים אוטומטית במכשיר</b><div class="mini">אפשר לבטל את הפעולה האחרונה בכל רגע.</div><button class="undo" onclick="undo()">ביטול הפעולה האחרונה</button></div><div class="card"><button class="undo" onclick="resetGame()">איפוס המשחק כולו</button></div></section>
</main><nav><button class="on" onclick="showView('game',this)">🏀<br>משחק</button><button onclick="showView('sum',this)">📊<br>סיכום</button><button onclick="showView('tools',this)">⚙️<br>כלים</button></nav>
<div class="modal" id="modal"><div class="sheet"><h3 id="mt"></h3><p id="mx"></p><div id="mk"></div><div class="sheetBtns"><button class="secondary" onclick="closeM()">להישאר בסיכום</button><button class="primary" id="next" onclick="nextQ()">פתח רבע הבא</button></div></div></div>
<script>
var P=[[2,'איתן בשירי'],[3,'נדב ברנשטיין'],[5,'אריאל שחב'],[7,'הרינג בן אברהם'],[9,'נועם גני'],[10,'גיא כהן'],[12,'שי נזרוב'],[13,'שון נוי'],[14,'תומר צור ואזנה'],[15,'גיא יאגודייב'],[23,'אוראל אל ים'],[28,'עמנואל לייפר'],[58,'הדר שקולניק'],[91,'מאיקי יהב']];
var F=['m2','x2','m3','x3','m1','x1','or','dr','a','s','to','pf'],L={m2:'2 נק׳ ✓',x2:'2 נק׳ ✗',m3:'3 נק׳ ✓',x3:'3 נק׳ ✗',m1:'עונשין ✓',x1:'עונשין ✗',or:'ריב׳ התקפה',dr:'ריב׳ הגנה',a:'אסיסט',s:'חטיפה',to:'איבוד',pf:'עבירה'},K='avi_stats_07102026_v3',sel=null,range='q1';
function blank(){var o={};F.forEach(function(x){o[x]=0});return o}function fresh(){var q={};for(var i=1;i<5;i++){q[i]={p:{},opp:0};P.forEach(function(x){q[i].p[x[0]]=blank()})}return{qtr:1,q:q,log:[]}}function load(){try{return JSON.parse(localStorage.getItem(K))||fresh()}catch(e){return fresh()}}var st=load();function save(){localStorage.setItem(K,JSON.stringify(st))}
function s(q,n){return st.q[q].p[n]}function pts(x){return x.m2*2+x.m3*3+x.m1}function reb(x){return x.or+x.dr}function sum(qs,n){var t=blank();qs.forEach(function(q){F.forEach(function(f){t[f]+=s(q,n)[f]})});return t}function team(qs){var t=blank();P.forEach(function(p){var x=sum(qs,p[0]);F.forEach(function(f){t[f]+=x[f]})});return t}function pct(m,x){return m+x?Math.round(m/(m+x)*100)+'%':'0%'}function qs(r){return r=='q1'?[1]:r=='q2'?[2]:r=='half'?[1,2]:r=='q3'?[3]:r=='q4'?[4]:[1,2,3,4]}function our(a){return pts(team(a||[1,2,3,4]))}function opp(a){return (a||[1,2,3,4]).reduce(function(z,q){return z+st.q[q].opp},0)}
function render(){document.getElementById('qpill').textContent='רבע '+st.qtr;document.getElementById('ours').textContent=our();document.getElementById('opp').textContent=opp();document.getElementById('qs').innerHTML=[1,2,3,4].map(function(q){return '<button class="'+(q==st.qtr?'on':'')+'" onclick="setQ('+q+')">רבע '+q+'</button>'}).join('');document.getElementById('roster').innerHTML=P.map(function(p){var x=s(st.qtr,p[0]);return '<div class="pl" onclick="openP('+p[0]+')"><div class="num">'+p[0]+'</div><div><div class="name">'+p[1]+'</div><div class="mini">'+reb(x)+' ריב׳ · '+x.a+' אס׳ · '+x.to+' איב׳</div></div><div class="pts">'+pts(x)+'</div></div>'}).join('');renderSum()}
function setQ(q){st.qtr=q;sel=null;save();back();render()}function openP(n){sel=n;var p=P.find(function(x){return x[0]==n}),x=s(st.qtr,n);document.getElementById('pick').style.display='none';var e=document.getElementById('entry');e.style.display='block';e.innerHTML='<div class="row"><button class="back" onclick="back()">חזרה לסגל</button><div><div class="name">'+p[1]+' · #'+p[0]+'</div><div class="mini">רבע '+st.qtr+'</div></div></div><div class="live"><div class="box"><b>'+pts(x)+'</b><span>נקודות</span></div><div class="box"><b>'+reb(x)+'</b><span>ריבאונדים</span></div><div class="box"><b>'+x.a+'</b><span>אסיסטים</span></div><div class="box"><b>'+x.to+'</b><span>איבודים</span></div></div><div class="card"><b>קליעה</b><div class="actions" style="margin-top:9px"><button class="act ok" onclick="add(\'m2\')">2 נק׳ ✓</button><button class="act bad" onclick="add(\'x2\')">2 נק׳ ✗</button><button class="act ok" onclick="add(\'m3\')">3 נק׳ ✓</button><button class="act bad" onclick="add(\'x3\')">3 נק׳ ✗</button><button class="act ok" onclick="add(\'m1\')">עונשין ✓</button><button class="act bad" onclick="add(\'x1\')">עונשין ✗</button></div></div><div class="card"><b>פעולות נוספות</b><div class="actions" style="margin-top:9px"><button class="act neu" onclick="add(\'or\')">ריב׳ התקפה</button><button class="act neu" onclick="add(\'dr\')">ריב׳ הגנה</button><button class="act gold" onclick="add(\'a\')">אסיסט</button><button class="act gold" onclick="add(\'s\')">חטיפה</button><button class="act bad" onclick="add(\'to\')">איבוד</button><button class="act bad" onclick="add(\'pf\')">עבירה</button></div><button class="undo" onclick="undo()">ביטול הפעולה האחרונה</button></div>'}function back(){document.getElementById('pick').style.display='block';document.getElementById('entry').style.display='none';sel=null}function add(f){if(sel==null)return;s(st.qtr,sel)[f]++;st.log.push({t:'p',q:st.qtr,n:sel,f:f});save();openP(sel);render()}
function addOpp(v){var q=st.qtr;if(v<0){if(st.q[q].opp>0){st.q[q].opp--;st.log.push({t:'o',q:q,v:-1})}}else{st.q[q].opp+=v;st.log.push({t:'o',q:q,v:v})}save();render()}function undo(){var e=st.log.pop();if(!e)return;if(e.t=='p')s(e.q,e.n)[e.f]=Math.max(0,s(e.q,e.n)[e.f]-1);else st.q[e.q].opp=Math.max(0,st.q[e.q].opp-e.v);save();render();if(sel)openP(sel)}
function showView(id,b){document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});document.getElementById(id).classList.add('on');document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');if(id=='sum')renderSum();scrollTo(0,0)}function setR(r){range=r;renderSum()}function renderSum(){var T=[['q1','רבע 1'],['q2','רבע 2'],['half','מחצית'],['q3','רבע 3'],['q4','רבע 4'],['game','משחק']];document.getElementById('tabs').innerHTML=T.map(function(t){return '<button class="'+(range==t[0]?'on':'')+'" onclick="setR(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');var a=qs(range),t=team(a),title=range=='half'?'סיכום מחצית':range=='game'?'סיכום משחק':'סיכום רבע '+range.slice(1),half=range=='half'?'<div class="half"><b>תמונת מחצית</b><div>תוצאה '+our(a)+' : '+opp(a)+' · אסיסטים '+t.a+' · איבודים '+t.to+'</div></div>':'';var rows=P.map(function(p){var x=sum(a,p[0]);return '<tr><td>#'+p[0]+' '+p[1]+'</td><td>'+pts(x)+'</td><td>'+x.m2+'/'+(x.m2+x.x2)+'</td><td>'+pct(x.m2,x.x2)+'</td><td>'+x.m3+'/'+(x.m3+x.x3)+'</td><td>'+pct(x.m3,x.x3)+'</td><td>'+x.m1+'/'+(x.m1+x.x1)+'</td><td>'+pct(x.m1,x.x1)+'</td><td>'+reb(x)+'</td><td>'+x.a+'</td><td>'+x.s+'</td><td>'+x.to+'</td><td>'+x.pf+'</td></tr>'}).join('');document.getElementById('summary').innerHTML=half+'<div class="card"><b>'+title+' · '+our(a)+' : '+opp(a)+'</b><div class="kpis" style="margin-top:9px"><div class="kpi"><b>'+pct(t.m2,t.x2)+'</b><span>2 נק׳</span></div><div class="kpi"><b>'+pct(t.m3,t.x3)+'</b><span>3 נק׳</span></div><div class="kpi"><b>'+pct(t.m1,t.x1)+'</b><span>עונשין</span></div><div class="kpi"><b>'+reb(t)+'</b><span>ריבאונדים</span></div><div class="kpi"><b>'+t.a+'</b><span>אסיסטים</span></div><div class="kpi"><b>'+t.to+'</b><span>איבודים</span></div></div></div><div class="table"><table><thead><tr><th>שחקן</th><th>נק׳</th><th>2P</th><th>2P%</th><th>3P</th><th>3P%</th><th>FT</th><th>FT%</th><th>REB</th><th>AST</th><th>STL</th><th>TO</th><th>PF</th></tr></thead><tbody>'+rows+'<tr class="total"><td>קבוצה</td><td>'+pts(t)+'</td><td>'+t.m2+'/'+(t.m2+t.x2)+'</td><td>'+pct(t.m2,t.x2)+'</td><td>'+t.m3+'/'+(t.m3+t.x3)+'</td><td>'+pct(t.m3,t.x3)+'</td><td>'+t.m1+'/'+(t.m1+t.x1)+'</td><td>'+pct(t.m1,t.x1)+'</td><td>'+reb(t)+'</td><td>'+t.a+'</td><td>'+t.s+'</td><td>'+t.to+'</td><td>'+t.pf+'</td></tr></tbody></table></div>'}
function endQ(){range=st.qtr==2?'half':st.qtr==4?'game':'q'+st.qtr;renderSum();var a=qs(range),t=team(a);document.getElementById('mt').textContent=st.qtr==2?'סיכום מחצית':st.qtr==4?'סיכום משחק':'סיכום רבע '+st.qtr;document.getElementById('mx').textContent='תוצאה '+our(a)+' : '+opp(a)+' · ריבאונדים '+reb(t)+' · אסיסטים '+t.a+' · איבודים '+t.to;document.getElementById('mk').innerHTML='<div class="kpis"><div class="kpi"><b>'+pct(t.m2,t.x2)+'</b><span>2 נק׳</span></div><div class="kpi"><b>'+pct(t.m3,t.x3)+'</b><span>3 נק׳</span></div><div class="kpi"><b>'+pct(t.m1,t.x1)+'</b><span>עונשין</span></div></div>';document.getElementById('next').style.display=st.qtr<4?'block':'none';document.getElementById('modal').classList.add('on');document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});document.getElementById('sum').classList.add('on');document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});document.querySelectorAll('nav button')[1].classList.add('on')}
function closeM(){document.getElementById('modal').classList.remove('on')}function nextQ(){if(st.qtr<4)st.qtr++;save();closeM();render();document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});document.getElementById('game').classList.add('on');document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});document.querySelectorAll('nav button')[0].classList.add('on');back()}function resetGame(){if(confirm('לאפס את כל נתוני המשחק?')){st=fresh();save();render();back()}}render();
</script></body></html>
