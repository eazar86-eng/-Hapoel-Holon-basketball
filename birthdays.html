<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35185f"><title>ימי הולדת | הפועל אבי חולון</title><style>:root{--p:#35185f;--p2:#623ba0;--y:#f2c433;--bg:#f7f3e9;--ink:#21172f;--muted:#746d80;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:84px}.hero{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;padding:24px 18px}.wrap,main{max-width:760px;margin:auto}.brand{font-weight:900;color:var(--y)}h1{font-size:34px;margin:6px 0}.sub{opacity:.9;font-weight:700}.next{margin-top:16px;background:rgba(0,0,0,.2);border:1px solid rgba(242,196,51,.38);padding:16px;border-radius:17px}.next-label{font-size:13px;font-weight:900;color:var(--y)}#nextName{font-size:24px;font-weight:950;margin-top:4px}#countdown{font-size:14px;font-weight:800;margin-top:4px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.nav a{text-align:center;text-decoration:none;background:#fff;color:var(--p);padding:11px;border-radius:12px;font-weight:900}main{padding:16px}.month{margin:20px 0}.mh{font-size:23px;font-weight:950;color:var(--p);border-bottom:3px solid #d7b375;padding-bottom:7px}.person{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid rgba(53,24,95,.1);border-radius:15px;padding:13px 14px;margin:9px 0}.person.today{border:2px solid var(--y);box-shadow:0 0 0 4px #fff4c7}.who{font-weight:950}.date{font-weight:900;color:var(--p);direction:ltr}.staff{font-size:11px;background:#eee8f8;color:var(--p);padding:3px 7px;border-radius:999px;font-weight:900;margin-right:6px}.privacy{background:#fff8dc;border:1px solid #e8c84d;border-radius:14px;padding:12px;font-size:12px;color:#66520d;font-weight:750;line-height:1.5}.footer{text-align:center;color:var(--muted);font-size:12px;margin:30px 0}.home-fab{position:fixed;left:18px;bottom:18px;z-index:99;background:var(--p);color:#fff;text-decoration:none;font-weight:900;border-radius:999px;padding:12px 16px;box-shadow:0 8px 24px rgba(53,24,95,.28);border:2px solid rgba(255,255,255,.7)}</style></head><body><a class="home-fab" href="./">🏠 דף הבית</a><header class="hero"><div class="wrap"><div class="brand">🎂 הפועל ״אבי״ חולון</div><h1>ימי הולדת בקבוצה</h1><div class="sub">תאריכי יום ההולדת של שחקני הקבוצה והצוות המקצועי</div><div class="next"><div class="next-label">יום ההולדת הבא</div><div id="nextName">טוען…</div><div id="countdown"></div></div><div class="nav"><a href="./">🏠 דף הקבוצה</a><a href="week-03.html">📅 מערכת שבועית</a></div></div></header><main><div class="privacy">באתר הציבורי מוצגים רק שם ויום/חודש. מספרי טלפון, שנת לידה ופרטי ביגוד אינם מוצגים.</div><div id="months"></div><div class="footer">💜💛 הפועל ״אבי״ חולון · 2026</div></main><script>const people=[{n:'גיא יאגודייב',d:6,m:1},{n:'גיא כהן',d:9,m:1},{n:'נועם גני',d:24,m:1},{n:'רועי ששון',d:26,m:1,s:1},{n:'תומר פליסטה',d:4,m:2},{n:'הרינג בן אברהם',d:13,m:2},{n:'אורי דביר',d:18,m:3},{n:'איתן בשירי',d:28,m:4},{n:'יהב מאיקי קדוגו',d:5,m:5},{n:'אוראל אל-ים',d:9,m:5},{n:'נדב ברנשטיין',d:16,m:5},{n:'שי נזרוב',d:12,m:6},{n:'הדר שקולניק',d:26,m:7},{n:'שון נוי',d:13,m:8},{n:'עמנואל לייפר',d:28,m:8},{n:'אריאל שחב',d:7,m:12},{n:'אופק כהן',d:15,m:12,s:1}];const names=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];function localParts(){const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const [y,m,d]=f.split('-').map(Number);return{y,m,d}}function nextBirthday(){const t=localParts();let best=null;for(const p of people){let dt=new Date(Date.UTC(t.y,p.m-1,p.d));let today=new Date(Date.UTC(t.y,t.m-1,t.d));if(dt<today)dt=new Date(Date.UTC(t.y+1,p.m-1,p.d));const diff=dt-today;if(!best||diff<best.diff)best={...p,diff,dt}}return best}function render(){const t=localParts();const box=document.getElementById('months');for(let m=1;m<=12;m++){const arr=people.filter(p=>p.m===m);if(!arr.length)continue;const sec=document.createElement('section');sec.className='month';sec.innerHTML='<div class="mh">'+names[m-1]+'</div>';arr.sort((a,b)=>a.d-b.d).forEach(p=>{const row=document.createElement('div');row.className='person'+(p.m===t.m&&p.d===t.d?' today':'');row.innerHTML='<div class="who">'+p.n+(p.s?'<span class="staff">סגל מקצועי</span>':'')+'</div><div class="date">'+p.d+'/'+p.m+'</div>';sec.appendChild(row)});box.appendChild(sec)}const n=nextBirthday();const days=Math.round(n.diff/86400000);document.getElementById('nextName').textContent=n.n+' · '+n.d+'/'+n.m;document.getElementById('countdown').textContent=days===0?'🎉 היום יום ההולדת!':days===1?'מחר חוגגים 🎈':'בעוד '+days+' ימים'}render();</script></body></html>
