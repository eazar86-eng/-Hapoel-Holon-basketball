<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25103f"><title>אמת או שקר - ערב הגיבוש</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#6c3ba2 0,#2a1245 42%,#13091f 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:950;color:#f3cf3e}.progress{background:#ffffff18;border:1px solid #ffffff28;padding:9px 15px;border-radius:30px;font-weight:800}.stage{text-align:center;padding:6vh 0 20px}.stage h1{font-size:clamp(34px,6vw,68px);margin:5px}.sub{opacity:.8}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:30px 0}.statement{min-height:230px;background:#fff;color:#23142f;border-radius:26px;padding:28px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(21px,3vw,34px);font-weight:850;line-height:1.45;box-shadow:0 20px 45px #0005;position:relative}.num{position:absolute;top:14px;right:17px;background:#f2c433;color:#271541;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:16px;padding:15px 24px;font:inherit;font-weight:950;font-size:18px;cursor:pointer}.next{background:#f2c433;color:#26133f}.prev{background:#ffffff20;color:white;border:1px solid #ffffff30}.shuffle{background:#fff;color:#35185f}.lock{max-width:430px;margin:15vh auto;background:#fff;color:#241631;padding:28px;border-radius:25px;text-align:center}.lock input{width:100%;padding:14px;border:2px solid #ddd;border-radius:12px;font:inherit;margin:12px 0}.lock button{width:100%;background:#35185f;color:white}.hide{display:none}.finish{text-align:center;font-size:30px;padding:12vh 0}@media(max-width:700px){.pair{grid-template-columns:1fr}.statement{min-height:190px}.top{font-size:13px}.stage{padding-top:3vh}}</style></head><body><div id="lock" class="lock"><div style="font-size:50px">🔐</div><h2>עמוד ההצגה של אלי</h2><p>הכנס את קוד הערב כדי לפתוח את כל זוגות המשפטים.</p><input id="code" type="password" placeholder="קוד כניסה"><button onclick="login()">כניסה לערב 🎭</button><p id="err" style="color:#b42318"></p></div><main id="app" class="wrap hide"><div class="top"><div class="brand">הפועל ״אבי״ חולון 💜💛</div><div class="progress" id="progress"></div></div><section class="stage"><div class="sub">ערב גיבוש · אמת או שקר</div><h1 id="title">🎭 זוג 1</h1></section><section class="pair"><div class="statement"><span class="num">1</span><span id="a"></span></div><div class="statement"><span class="num">2</span><span id="b"></span></div></section><div class="controls"><button class="prev" onclick="prev()">⬅ הקודם</button><button class="shuffle" onclick="shufflePairs()">🔀 ערבב זוגות</button><button class="next" onclick="next()">הזוג הבא ➜</button></div></main><script>
const API="https://yistkmkezrhuggvipqnh.supabase.co/functions/v1/truth-lie-present";let pairs=[],i=0,key="";
async function login(){key=document.getElementById("code").value.trim();try{const r=await fetch(API,{headers:{"x-present-key":key}});if(!r.ok)throw 0;pairs=await r.json();document.getElementById("lock").classList.add("hide");document.getElementById("app").classList.remove("hide");render()}catch{document.getElementById("err").textContent="קוד לא נכון"}}
function render(){if(!pairs.length)return;const p=pairs[i];document.getElementById("title").textContent="🎭 זוג "+(i+1);document.getElementById("progress").textContent=(i+1)+" / "+pairs.length;document.getElementById("a").textContent=p.statement_a;document.getElementById("b").textContent=p.statement_b}
function next(){if(i<pairs.length-1){i++;render()}else alert("סיימתם את כל "+pairs.length+" הזוגות 🎉")}
function prev(){if(i>0){i--;render()}}
function shufflePairs(){for(let x=pairs.length-1;x>0;x--){const j=Math.floor(Math.random()*(x+1));[pairs[x],pairs[j]]=[pairs[j],pairs[x]]}i=0;render()}
document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
