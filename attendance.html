<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35185f"><title>נוכחות אימונים | הפועל ״אבי״ חולון</title><style>:root{--p:#35185f;--p2:#623ba0;--y:#f2c433;--bg:#f7f3e9;--ink:#21172f;--muted:#746d80;--card:#fff;--green:#167c53;--red:#b84242;--orange:#b76b16;--blue:#3967a7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:96px}.hero{background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;padding:24px 18px}.wrap,main{max-width:780px;margin:auto}.brand{font-weight:900;color:var(--y)}h1{font-size:34px;margin:6px 0}.sub{font-weight:700;opacity:.9;line-height:1.5}main{padding:16px}.box{background:#fff;border:1px solid rgba(53,24,95,.11);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 5px 16px rgba(53,24,95,.045)}.section-title{font-size:20px;font-weight:950;color:var(--p);margin:4px 0 13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:0 3px 5px}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(53,24,95,.17);background:#fff;border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(53,24,95,.09)}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:950;font-size:14px;cursor:pointer}.primary{background:var(--p);color:#fff}.gold{background:var(--y);color:var(--p)}.light{background:#f0ecf6;color:var(--p)}.danger{background:#fff1f1;color:var(--red);border:1px solid #efc7c7}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{background:#fff;border:1px solid rgba(53,24,95,.1);border-radius:13px;padding:10px 5px;text-align:center}.stat strong{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted);font-weight:900}.player{background:#fff;border:1px solid rgba(53,24,95,.1);border-radius:16px;padding:13px;margin:9px 0}.player-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:16px;font-weight:950}.status-text{font-size:11px;font-weight:900;color:var(--muted)}.status-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.status{border:1px solid rgba(53,24,95,.12);background:#f8f6fb;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:900;color:#5a5263;cursor:pointer}.status.active[data-s="present"]{background:#e4f5ed;border-color:#92ceb4;color:var(--green)}.status.active[data-s="late"]{background:#fff2df;border-color:#e6bd80;color:var(--orange)}.status.active[data-s="absent"]{background:#fde9e9;border-color:#e4a8a8;color:var(--red)}.status.active[data-s="excused"]{background:#e9f0fb;border-color:#adc1df;color:var(--blue)}.note{width:100%;border:0;border-top:1px solid #eee7f3;margin-top:10px;padding:9px 2px 2px;font:inherit;font-size:12px;outline:none}.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(247,243,233,.96);backdrop-filter:blur(12px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(53,24,95,.12);z-index:50}.saveinner{max-width:780px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.save{background:var(--p);color:#fff;border:0;border-radius:13px;padding:13px;font-weight:950;font-size:15px}.home{background:#fff;color:var(--p);text-decoration:none;border:1px solid rgba(53,24,95,.12);border-radius:13px;padding:13px 15px;font-weight:950}.history-item{border-top:1px solid #eee7f3;padding:12px 0}.history-item:first-of-type{border-top:0}.history-head{display:flex;justify-content:space-between;gap:10px;font-weight:900}.history-meta{font-size:12px;color:var(--muted);margin-top:4px}.history-actions{display:flex;gap:7px;margin-top:8px}.smallbtn{border:0;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer}.empty{text-align:center;color:var(--muted);font-weight:700;padding:18px}.notice{background:#fff8dc;border:1px solid #e7c94f;color:#67520c;border-radius:13px;padding:11px;font-size:12px;font-weight:750;line-height:1.5;margin-bottom:14px}@media(max-width:560px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.status-buttons{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(4,1fr)}.stat strong{font-size:17px}}</style></head><body><header class="hero"><div class="wrap"><div class="brand">🟡🟣 הפועל ״אבי״ חולון</div><h1>דיווח נוכחות</h1><div class="sub">נערים י׳ לאומית · מעקב נוכחות אימונים לאורך העונה</div></div></header><main><div class="notice">הנתונים נשמרים כרגע במכשיר ובדפדפן שבו בוצע הדיווח. מומלץ לבצע ייצוא תקופתי לאקסל כגיבוי. בהמשך ניתן לחבר אחסון מרכזי משותף לכל הצוות.</div><section class="box"><div class="section-title">פרטי האימון</div><div class="fields"><div class="field"><label>תאריך</label><input id="date" type="date"></div><div class="field"><label>שעה</label><input id="time" type="time"></div><div class="field"><label>סוג פעילות</label><select id="type"><option>אימון כדורסל</option><option>חדר כושר</option><option>אתלטיקה</option><option>משחק</option><option>מחנה אימון</option><option>אחר</option></select></div><div class="field"><label>מאמן מדווח</label><select id="coach"><option>רועי ששון</option><option>אופק כהן</option><option>אחר</option></select></div><div class="field wide"><label>מיקום</label><input id="location" placeholder="לדוגמה: פחים"></div><div class="field wide"><label>הערה כללית לאימון</label><textarea id="sessionNote" rows="2" placeholder="אופציונלי"></textarea></div></div><div class="actions"><button class="btn gold" id="allPresent">✓ סמן כולם נוכחים</button><button class="btn light" id="clearAll">נקה סימונים</button></div></section><div class="summary"><div class="stat"><strong id="sp">0</strong><span>נוכחים</span></div><div class="stat"><strong id="sl">0</strong><span>איחרו</span></div><div class="stat"><strong id="sa">0</strong><span>נעדרו</span></div><div class="stat"><strong id="se">0</strong><span>מוצדק</span></div></div><section id="players"></section><section class="box"><div class="section-title">היסטוריית דיווחים</div><div class="actions"><button class="btn primary" id="export">📊 ייצוא לאקסל</button><button class="btn light" id="backup">גיבוי JSON</button></div><div id="history"></div></section></main><div class="savebar"><div class="saveinner"><button class="save" id="save">שמירת דיווח נוכחות</button><a class="home" href="./">🏠 בית</a></div></div><script>const roster=['עמנואל לייפר','שון נוי','אריאל שחב','נועם גני','גיא כהן','גיא יאגודייב','יהב מאייקי קדוגו','הרינג בן אברהם','תומר פליסטה','אורי דביר','איתן בשירי','נדב ברנשטיין','אוראל אל-ים','שי נזרוב','הדר שקולניק'];const labels={present:'נוכח',late:'איחר',absent:'נעדר',excused:'מוצדק'};const key='hapoelAviHolonAttendanceV1';let state={};let editId=null;const playersBox=document.getElementById('players');function todayIL(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}document.getElementById('date').value=todayIL();function renderPlayers(){playersBox.innerHTML='';roster.forEach((name,i)=>{const p=document.createElement('div');p.className='player';p.innerHTML=`<div class="player-top"><div class="name">${i+1}. ${name}</div><div class="status-text" id="txt${i}">לא סומן</div></div><div class="status-buttons">${['present','late','absent','excused'].map(s=>`<button class="status" data-i="${i}" data-s="${s}">${labels[s]}</button>`).join('')}</div><input class="note" id="note${i}" placeholder="הערה לשחקן, אופציונלי">`;playersBox.appendChild(p)});document.querySelectorAll('.status').forEach(b=>b.onclick=()=>setStatus(+b.dataset.i,b.dataset.s));updateSummary()}function setStatus(i,s){state[i]=s;document.querySelectorAll(`.status[data-i="${i}"]`).forEach(b=>b.classList.toggle('active',b.dataset.s===s));document.getElementById('txt'+i).textContent=labels[s];updateSummary()}function updateSummary(){const vals=Object.values(state);sp.textContent=vals.filter(x=>x==='present').length;sl.textContent=vals.filter(x=>x==='late').length;sa.textContent=vals.filter(x=>x==='absent').length;se.textContent=vals.filter(x=>x==='excused').length}allPresent.onclick=()=>{roster.forEach((_,i)=>setStatus(i,'present'))};clearAll.onclick=()=>{state={};roster.forEach((_,i)=>{document.querySelectorAll(`.status[data-i="${i}"]`).forEach(b=>b.classList.remove('active'));document.getElementById('txt'+i).textContent='לא סומן';document.getElementById('note'+i).value=''});updateSummary()};function records(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function store(a){localStorage.setItem(key,JSON.stringify(a))}function saveRecord(){const date=document.getElementById('date').value;if(!date){alert('יש לבחור תאריך');return}const missing=roster.length-Object.keys(state).length;if(missing&&!confirm(`יש ${missing} שחקנים ללא סימון. לשמור בכל זאת?`))return;const rec={id:editId||Date.now(),date,time:document.getElementById('time').value,type:document.getElementById('type').value,coach:document.getElementById('coach').value,location:document.getElementById('location').value,sessionNote:document.getElementById('sessionNote').value,players:roster.map((name,i)=>({name,status:state[i]||'',note:document.getElementById('note'+i).value||''})),savedAt:new Date().toISOString()};let a=records();if(editId)a=a.map(x=>x.id===editId?rec:x);else a.push(rec);store(a);editId=null;alert('הדיווח נשמר');resetForm();renderHistory()}save.onclick=saveRecord;function resetForm(){state={};document.getElementById('date').value=todayIL();document.getElementById('time').value='';document.getElementById('location').value='';document.getElementById('sessionNote').value='';renderPlayers()}function renderHistory(){const a=records().sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));const h=document.getElementById('history');if(!a.length){h.innerHTML='<div class="empty">עדיין אין דיווחים שמורים</div>';return}h.innerHTML=a.map(r=>{const c={present:0,late:0,absent:0,excused:0};r.players.forEach(p=>{if(c[p.status]!==undefined)c[p.status]++});return `<div class="history-item"><div class="history-head"><span>${r.date.split('-').reverse().join('/')} · ${r.type}</span><span>${r.time||''}</span></div><div class="history-meta">${r.coach}${r.location?' · '+r.location:''} · נוכחים ${c.present} · איחרו ${c.late} · נעדרו ${c.absent} · מוצדק ${c.excused}</div><div class="history-actions"><button class="smallbtn" onclick="editRec(${r.id})">עריכה</button><button class="smallbtn danger" onclick="deleteRec(${r.id})">מחיקה</button></div></div>`}).join('')}window.editRec=id=>{const r=records().find(x=>x.id===id);if(!r)return;editId=id;date.value=r.date;time.value=r.time||'';type.value=r.type;coach.value=r.coach;location.value=r.location||'';sessionNote.value=r.sessionNote||'';state={};r.players.forEach((p,i)=>{if(p.status)setStatus(i,p.status);document.getElementById('note'+i).value=p.note||''});scrollTo({top:0,behavior:'smooth'})};window.deleteRec=id=>{if(!confirm('למחוק את דיווח הנוכחות?'))return;store(records().filter(x=>x.id!==id));renderHistory()};function q(v){v=String(v??'').replaceAll('"','""');return `"${v}"`}export.onclick=()=>{const a=records().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));if(!a.length){alert('אין נתונים לייצוא');return}const rows=[['תאריך','שעה','סוג פעילות','מאמן','מיקום','שחקן','סטטוס','הערת שחקן','הערה כללית']];a.forEach(r=>r.players.forEach(p=>rows.push([r.date,r.time,r.type,r.coach,r.location,p.name,labels[p.status]||'לא סומן',p.note,r.sessionNote])));const csv='\ufeff'+rows.map(row=>row.map(q).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const aTag=document.createElement('a');aTag.href=u;aTag.download='נוכחות-הפועל-אבי-חולון.csv';aTag.click();URL.revokeObjectURL(u)};backup.onclick=()=>{const blob=new Blob([JSON.stringify(records(),null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const aTag=document.createElement('a');aTag.href=u;aTag.download='attendance-backup.json';aTag.click();URL.revokeObjectURL(u)};renderPlayers();renderHistory();</script></body></html>
