<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35185f"><title>נוכחות כדורסל | הפועל ״אבי״ חולון</title><style>:root{--p:#35185f;--y:#f2c433;--bg:#f7f3e9;--muted:#746d80}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#21172f;padding-bottom:85px}.hero{background:linear-gradient(145deg,#35185f,#623ba0);color:#fff;padding:24px 18px}.wrap,main{max-width:760px;margin:auto}.brand{color:var(--y);font-weight:900}h1{margin:6px 0;font-size:32px}.session{margin-top:14px;background:rgba(0,0,0,.2);border:1px solid rgba(242,196,51,.4);border-radius:16px;padding:14px}.session strong{display:block;font-size:20px}.session span{font-size:13px;opacity:.9}main{padding:16px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:12px;padding:12px;font-weight:900}.all{background:var(--y);color:var(--p)}.clear{background:#fff;color:var(--p);border:1px solid #ddd}.player{background:#fff;border:1px solid #e8e1ee;border-radius:15px;padding:13px;margin:9px 0}.top{display:flex;justify-content:space-between;align-items:center}.name{font-weight:950}.current{font-size:11px;color:var(--muted);font-weight:800}.statuses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.status{border:1px solid #ddd;background:#f8f6fb;border-radius:9px;padding:9px 2px;font-size:12px;font-weight:900}.status.active[data-s=present]{background:#e3f5ec;color:#167c53;border-color:#8fc9ae}.status.active[data-s=late]{background:#fff0dc;color:#a96212;border-color:#dfb678}.status.active[data-s=absent]{background:#fde8e8;color:#ad3d3d;border-color:#dda0a0}.status.active[data-s=excused]{background:#e9f0fb;color:#3967a7;border-color:#adc1df}.summary{font-size:13px;font-weight:900;color:var(--p);margin:12px 2px}.history{background:#fff;border-radius:15px;padding:14px;margin-top:20px}.history h2{font-size:18px;margin:0 0 10px}.record{border-top:1px solid #eee;padding:10px 0}.record:first-of-type{border-top:0}.meta{font-size:12px;color:var(--muted);margin-top:3px}.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(247,243,233,.96);padding:10px 14px;border-top:1px solid #ddd}.saveinner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.save{border:0;background:var(--p);color:#fff;border-radius:12px;padding:13px;font-weight:950}.home{background:#fff;color:var(--p);text-decoration:none;border:1px solid #ddd;border-radius:12px;padding:13px;font-weight:900}@media(max-width:480px){.statuses{grid-template-columns:1fr 1fr}}</style></head><body><header class="hero"><div class="wrap"><div class="brand">🟡🟣 הפועל ״אבי״ חולון</div><h1>נוכחות אימון כדורסל</h1><div class="session"><strong id="sessionTitle"></strong><span id="sessionMeta"></span></div></div></header><main><div class="tools"><button class="btn all" id="allPresent">✓ סמן את כולם נוכחים</button><button class="btn clear" id="clearAll">נקה</button></div><div class="summary" id="summary"></div><div id="players"></div><div class="history"><h2>היסטוריית נוכחות</h2><button class="btn clear" id="exportBtn">📊 ייצוא לאקסל</button><div id="historyList"></div></div></main><div class="savebar"><div class="saveinner"><button class="save" id="saveBtn">שמירת נוכחות</button><a class="home" href="./">🏠 בית</a></div></div><script>const roster=['עמנואל לייפר','שון נוי','אריאל שחב','נועם גני','גיא כהן','גיא יאגודייב','יהב מאייקי קדוגו','הרינג בן אברהם','תומר פליסטה','אורי דביר','איתן בשירי','נדב ברנשטיין','אוראל אל-ים','שי נזרוב','הדר שקולניק'];const practices=[{date:'2026-08-30',time:'20:00',end:'21:30',place:'פחים'},{date:'2026-08-31',time:'09:30',end:'11:00',place:'מקווה ישראל · אולם'},{date:'2026-09-02',time:'17:30',end:'19:00',place:'מקווה ישראל · אולם'}];const labels={present:'נוכח',late:'איחר',absent:'נעדר',excused:'מוצדק'};const key='hapoelAviHolonBasketballAttendanceV2';let state={};function pdate(p){return new Date(p.date+'T'+p.time+':00+03:00')}function getPractice(){const n=new Date(),windowStart=new Date(n.getTime()-180*60000);return practices.find(p=>pdate(p)>=windowStart)||practices[practices.length-1]}const practice=getPractice();sessionTitle.textContent='אימון כדורסל · '+practice.date.split('-').reverse().join('/');sessionMeta.textContent=practice.time+'–'+practice.end+' · 📍 '+practice.place;function render(){players.innerHTML='';roster.forEach((name,i)=>{const e=document.createElement('div');e.className='player';e.innerHTML='<div class="top"><div class="name">'+(i+1)+'. '+name+'</div><div class="current" id="c'+i+'">לא סומן</div></div><div class="statuses">'+['present','late','absent','excused'].map(s=>'<button class="status" data-i="'+i+'" data-s="'+s+'">'+labels[s]+'</button>').join('')+'</div>';players.appendChild(e)});document.querySelectorAll('.status').forEach(b=>b.onclick=()=>setStatus(+b.dataset.i,b.dataset.s));updateSummary()}function setStatus(i,s){state[i]=s;document.querySelectorAll('.status[data-i="'+i+'"]').forEach(b=>b.classList.toggle('active',b.dataset.s===s));document.getElementById('c'+i).textContent=labels[s];updateSummary()}function updateSummary(){const a=Object.values(state);summary.textContent='נוכחים: '+a.filter(x=>x==='present').length+' · איחרו: '+a.filter(x=>x==='late').length+' · נעדרו: '+a.filter(x=>x==='absent').length+' · מוצדק: '+a.filter(x=>x==='excused').length}allPresent.onclick=()=>roster.forEach((_,i)=>setStatus(i,'present'));clearAll.onclick=()=>{state={};render()};function records(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function store(a){localStorage.setItem(key,JSON.stringify(a))}saveBtn.onclick=()=>{if(Object.keys(state).length!==roster.length){alert('יש שחקנים שעדיין לא סומנו');return}const rec={id:practice.date+'_'+practice.time,date:practice.date,time:practice.time,end:practice.end,place:practice.place,players:roster.map((name,i)=>({name,status:state[i]})),savedAt:new Date().toISOString()};let a=records(),i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);store(a);alert('הנוכחות נשמרה');renderHistory()};function renderHistory(){const a=records().sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));historyList.innerHTML=a.length?a.map(r=>{const c={present:0,late:0,absent:0,excused:0};r.players.forEach(p=>c[p.status]++);return '<div class="record"><strong>'+r.date.split('-').reverse().join('/')+' · '+r.time+' · '+r.place+'</strong><div class="meta">נוכחים '+c.present+' · איחרו '+c.late+' · נעדרו '+c.absent+' · מוצדק '+c.excused+'</div></div>'}).join(''):'<div class="meta">עדיין אין דיווחים שמורים</div>'}exportBtn.onclick=()=>{const a=records();if(!a.length){alert('אין נתונים לייצוא');return}const rows=[['תאריך','שעה','מיקום','שחקן','סטטוס']];a.forEach(r=>r.players.forEach(p=>rows.push([r.date,r.time,r.place,p.name,labels[p.status]||p.status])));const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='נוכחות_כדורסל_הפועל_אבי_חולון.csv';a.click();URL.revokeObjectURL(u)};render();renderHistory();</script></body></html>
