<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35185f"><title>נוכחות כדורסל | הפועל ״אבי״ חולון</title><style>:root{--p:#35185f;--y:#f2c433;--bg:#f7f3e9;--muted:#746d80}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#21172f;padding-bottom:88px}.hero{background:linear-gradient(145deg,#35185f,#623ba0);color:#fff;padding:24px 18px}.wrap,main{max-width:760px;margin:auto}.brand{color:var(--y);font-weight:900}h1{margin:6px 0;font-size:32px}.sub{font-weight:700;opacity:.9}.session{margin-top:14px;background:rgba(0,0,0,.2);border:1px solid rgba(242,196,51,.45);border-radius:16px;padding:14px}.session strong{display:block;font-size:20px}.session span{display:block;font-size:13px;opacity:.92;margin-top:3px}main{padding:16px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.kpi{background:#fff;border-radius:14px;padding:12px;text-align:center}.kpi strong{display:block;font-size:24px;color:var(--p)}.kpi span{font-size:11px;color:var(--muted);font-weight:800}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}button{font:inherit}.btn{border:0;border-radius:12px;padding:12px;font-weight:900}.all{background:var(--y);color:var(--p)}.clear{background:#fff;color:var(--p);border:1px solid #ddd}.summary{font-size:13px;font-weight:900;color:var(--p);margin:12px 2px}.player{background:#fff;border:1px solid #e8e1ee;border-radius:15px;padding:13px;margin:9px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-weight:950}.current{font-size:11px;color:var(--muted);font-weight:800}.statuses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.status{border:1px solid #ddd;background:#f8f6fb;border-radius:9px;padding:9px 2px;font-size:12px;font-weight:900}.status.active[data-s="present"]{background:#e3f5ec;color:#167c53;border-color:#8fc9ae}.status.active[data-s="late"]{background:#fff0dc;color:#a96212;border-color:#dfb678}.status.active[data-s="absent"]{background:#fde8e8;color:#ad3d3d;border-color:#dda0a0}.status.active[data-s="excused"]{background:#e9f0fb;color:#3967a7;border-color:#adc1df}.history,.playerstats{background:#fff;border-radius:15px;padding:14px;margin-top:20px}.history h2,.playerstats h2{font-size:18px;margin:0 0 10px}.record{border-top:1px solid #eee;padding:10px 0}.record:first-of-type{border-top:0}.meta{font-size:12px;color:var(--muted);margin-top:3px}.statrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-top:1px solid #eee;font-size:13px}.statrow:first-of-type{border-top:0}.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(247,243,233,.97);padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.saveinner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.save{border:0;background:var(--p);color:#fff;border-radius:12px;padding:13px;font-weight:950}.home{background:#fff;color:var(--p);text-decoration:none;border:1px solid #ddd;border-radius:12px;padding:13px;font-weight:900}@media(max-width:480px){.statuses{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="wrap"><div class="brand">🟡🟣 הפועל ״אבי״ חולון</div><h1>נוכחות אימון כדורסל</h1><div class="sub">סימון מהיר ומעקב לאורך העונה</div><div class="session"><strong id="sessionTitle">טוען אימון…</strong><span id="sessionMeta"></span></div></div></header><main><div class="kpis"><div class="kpi"><strong id="avgRate">0%</strong><span>נוכחות כוללת</span></div><div class="kpi"><strong id="reportCount">0</strong><span>דיווחים שמורים</span></div><div class="kpi"><strong id="fullCount">14</strong><span>שחקנים בסגל</span></div></div><div class="tools"><button class="btn all" id="allPresent" type="button">✓ סמן את כולם נוכחים</button><button class="btn clear" id="clearAll" type="button">נקה</button></div><div class="summary" id="summary">טרם סומנה נוכחות</div><div id="players"></div><div class="history"><h2>היסטוריית נוכחות</h2><button class="btn clear" id="exportBtn" type="button">📊 ייצוא לאקסל</button><div id="historyList"></div></div><div class="playerstats"><h2>אחוזי נוכחות לפי שחקן</h2><div id="playerStats"></div></div></main><div class="savebar"><div class="saveinner"><button class="save" id="saveBtn" type="button">שמירת נוכחות</button><a class="home" href="./">🏠 בית</a></div></div><script>(function(){'use strict';var roster=['עמנואל לייפר','שון נוי','אריאל שחב','נועם גני','גיא כהן','גיא יאגודייב','מאיקי יהב','הרינג בן אברהם','תומר פליסטה','איתן בשירי','נדב ברנשטיין','אוראל אל ים','שי נזרוב','הדר שקולניק'];var practices=[{date:'2026-08-30',time:'20:00',end:'21:30',place:'פחים'},{date:'2026-08-31',time:'09:30',end:'11:00',place:'מקווה ישראל · אולם'},{date:'2026-09-02',time:'17:30',end:'19:00',place:'מקווה ישראל · אולם'},{date:'2026-09-06',time:'18:30',end:'20:30',place:'ניצנים'},{date:'2026-09-07',time:'18:30',end:'20:00',place:'פחים'},{date:'2026-09-10',time:'19:00',end:'21:00',place:'מקווה ישראל · אולם'}];var labels={present:'נוכח',late:'איחר',absent:'נעדר',excused:'מוצדק'};var key='hapoelAviHolonBasketballAttendanceV2';var state={};var els={sessionTitle:document.getElementById('sessionTitle'),sessionMeta:document.getElementById('sessionMeta'),players:document.getElementById('players'),summary:document.getElementById('summary'),allPresent:document.getElementById('allPresent'),clearAll:document.getElementById('clearAll'),saveBtn:document.getElementById('saveBtn'),historyList:document.getElementById('historyList'),exportBtn:document.getElementById('exportBtn'),avgRate:document.getElementById('avgRate'),reportCount:document.getElementById('reportCount'),playerStats:document.getElementById('playerStats')};function practiceDate(p){return new Date(p.date+'T'+p.time+':00+03:00')}function getPractice(){var n=new Date(),threshold=new Date(n.getTime()-3*60*60*1000);for(var i=0;i<practices.length;i++){if(practiceDate(practices[i])>=threshold)return practices[i]}return practices[practices.length-1]}var practice=getPractice();function showSession(){els.sessionTitle.textContent='אימון כדורסל · '+practice.date.split('-').reverse().join('/');els.sessionMeta.textContent=practice.time+' עד '+practice.end+' · 📍 '+practice.place}function updateSummary(){var values=Object.keys(state).map(function(k){return state[k]});els.summary.textContent='נוכחים: '+values.filter(x=>x==='present').length+' · איחרו: '+values.filter(x=>x==='late').length+' · נעדרו: '+values.filter(x=>x==='absent').length+' · מוצדק: '+values.filter(x=>x==='excused').length}function setStatus(i,s){state[i]=s;document.querySelectorAll('.status[data-i="'+i+'"]').forEach(b=>b.classList.toggle('active',b.getAttribute('data-s')===s));document.getElementById('c'+i).textContent=labels[s];updateSummary()}function renderPlayers(){els.players.innerHTML='';roster.forEach(function(name,i){var box=document.createElement('div');box.className='player';box.innerHTML='<div class="top"><div class="name">'+(i+1)+'. '+name+'</div><div class="current" id="c'+i+'">לא סומן</div></div><div class="statuses"><button type="button" class="status" data-i="'+i+'" data-s="present">נוכח</button><button type="button" class="status" data-i="'+i+'" data-s="late">איחר</button><button type="button" class="status" data-i="'+i+'" data-s="absent">נעדר</button><button type="button" class="status" data-i="'+i+'" data-s="excused">מוצדק</button></div>';els.players.appendChild(box)});document.querySelectorAll('.status').forEach(b=>b.addEventListener('click',function(){setStatus(parseInt(this.getAttribute('data-i'),10),this.getAttribute('data-s'))}));updateSummary()}function records(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function store(a){localStorage.setItem(key,JSON.stringify(a))}function renderStats(){var a=records(),total=0,att=0;var per={};roster.forEach(n=>per[n]={total:0,att:0});a.forEach(r=>r.players.forEach(p=>{total++;if(p.status==='present'||p.status==='late'){att++;per[p.name].att++}if(per[p.name])per[p.name].total++}));els.avgRate.textContent=total?Math.round(att/total*100)+'%':'0%';els.reportCount.textContent=a.length;els.playerStats.innerHTML=roster.map(n=>'<div class="statrow"><strong>'+n+'</strong><span>'+(per[n].total?Math.round(per[n].att/per[n].total*100):0)+'%</span></div>').join('')}function renderHistory(){var a=records().sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));if(!a.length){els.historyList.innerHTML='<div class="meta">עדיין אין דיווחים שמורים</div>';renderStats();return}els.historyList.innerHTML=a.map(function(r){var c={present:0,late:0,absent:0,excused:0};r.players.forEach(p=>{if(c[p.status]!==undefined)c[p.status]++});return '<div class="record"><strong>'+r.date.split('-').reverse().join('/')+' · '+r.time+' · '+r.place+'</strong><div class="meta">נוכחים '+c.present+' · איחרו '+c.late+' · נעדרו '+c.absent+' · מוצדק '+c.excused+'</div></div>'}).join('');renderStats()}els.allPresent.addEventListener('click',()=>roster.forEach((_,i)=>setStatus(i,'present')));els.clearAll.addEventListener('click',function(){state={};renderPlayers()});els.saveBtn.addEventListener('click',function(){if(Object.keys(state).length!==roster.length){alert('יש שחקנים שעדיין לא סומנו');return}var rec={id:practice.date+'_'+practice.time,date:practice.date,time:practice.time,end:practice.end,place:practice.place,players:roster.map((name,i)=>({name:name,status:state[i]})),savedAt:new Date().toISOString()};var a=records(),idx=a.findIndex(x=>x.id===rec.id);if(idx>=0)a[idx]=rec;else a.push(rec);store(a);alert('הנוכחות נשמרה');renderHistory()});els.exportBtn.addEventListener('click',function(){var a=records();if(!a.length){alert('אין נתונים לייצוא');return}var rows=[['תאריך','שעה','מיקום','שחקן','סטטוס']];a.forEach(r=>r.players.forEach(p=>rows.push([r.date,r.time,r.place,p.name,labels[p.status]||p.status])));var csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='נוכחות_כדורסל_הפועל_אבי_חולון.csv';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)});showSession();renderPlayers();renderHistory()})();</script></body></html>
